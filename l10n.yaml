# The app's own UI strings, in Mongolian and English (Issue #503).
#
# `flutter gen-l10n` (also run by `flutter pub get`, since `pubspec.yaml`
# sets `generate: true`) writes `lib/l10n/app_localizations*.dart` from the
# ARB files. The generated files are committed: edit the ARB files, never the
# generated Dart. The strings are read through `L10n.current`
# (`lib/core/locale/l10n.dart`) by each feature's `*_strings.dart`.
arb-dir: lib/l10n
output-dir: lib/l10n
# Mongolian is the template: every message exists in it, and English falls
# back to it where no English copy has been approved yet.
template-arb-file: app_mn.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
preferred-supported-locales: [mn]
# Every message carries a description, for whoever translates it.
required-resource-attributes: true
nullable-getter: false
format: true
# The English messages still falling back to Mongolian — the open
# translation work, listed for review.
untranslated-messages-file: lib/l10n/untranslated_messages.json
header: |-
  // Generated by `flutter gen-l10n` from `lib/l10n/*.arb` (Issue #503).
  // Do not edit by hand: change the ARB files and regenerate.
